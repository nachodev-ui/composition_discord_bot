name: Apply PNG image fix

on:
  push:
    branches:
      - fix/replace-corrupt-build-image-png

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/replace-corrupt-build-image-png

      - name: Apply source and documentation updates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts

          python - <<'PY'
          from pathlib import Path
          import json

          old_url = 'https://cdn.jsdelivr.net/gh/nachodev-ui/composition_discord_bot@ec482cdad5308271b5edf09428cc5b00360662fa/assets/builds/05-bear-paws-x2.webp'
          new_url = 'https://raw.githubusercontent.com/nachodev-ui/composition_discord_bot/main/assets/builds/05-bear-paws-x2.png'

          presentation_path = Path('src/discord/buildPresentation.ts')
          presentation = presentation_path.read_text(encoding='utf-8')
          presentation = presentation.replace(
              ' * Las imágenes se sirven desde jsDelivr usando una revisión inmutable del\n'
              ' * repositorio de GitHub. Esto evita depender del filesystem del bot y también\n'
              ' * evita problemas de caché o de proxy con raw.githubusercontent.com.\n',
              ' * Las imágenes se sirven como PNG optimizados desde una URL pública directa.\n'
              ' * El archivo se valida por estructura y decodificación antes de integrarse, para\n'
              ' * impedir que un recurso truncado llegue al embed de Discord.\n',
          )
          presentation = presentation.replace(old_url, new_url)
          if old_url in presentation:
              raise SystemExit('No se reemplazó la URL antigua en buildPresentation.ts')
          presentation_path.write_text(presentation, encoding='utf-8', newline='\n')

          test_path = Path('test/buildPresentation.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(old_url, new_url)
          test = test.replace(
              "test('la build número 5 usa una URL CDN directa en el embed'",
              "test('la build número 5 usa una URL PNG directa en el embed'",
          )
          test_path.write_text(test, encoding='utf-8', newline='\n')

          config_path = Path('config/builds.json')
          config = config_path.read_text(encoding='utf-8')
          old_path = 'assets/builds/05-bear-paws-x2.webp'
          new_path = 'assets/builds/05-bear-paws-x2.png'
          if config.count(old_path) != 1:
              raise SystemExit(f'Se esperaba una referencia a {old_path}')
          config_path.write_text(config.replace(old_path, new_path), encoding='utf-8', newline='\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['images:validate'] = (
              'node scripts/validateBuildImages.mjs assets/builds/05-bear-paws-x2.png'
          )
          package['scripts']['check'] = (
              'pnpm lint && pnpm test && pnpm build && pnpm images:validate'
          )
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_section = '''La imagen incluida se sirve desde jsDelivr con una revisión inmutable del repositorio de GitHub. Esto evita depender de `raw.githubusercontent.com` y evita que una caché antigua siga ocultando la imagen.

```ts
const BUILD_IMAGE_URL_BY_ROLE = {
  'Bear Paws (x2)':
    'https://cdn.jsdelivr.net/gh/nachodev-ui/composition_discord_bot@REVISION/assets/builds/05-bear-paws-x2.webp',
};
```
'''
          new_section = '''La imagen de `Bear Paws (x2)` utiliza PNG porque la captura contiene texto pequeño, iconos y bordes definidos. Se optimizó a **500×326**, paleta indexada y aproximadamente **26 KB**, conservando legibilidad con compatibilidad máxima en Discord.

```ts
const BUILD_IMAGE_URL_BY_ROLE = {
  'Bear Paws (x2)':
    'https://raw.githubusercontent.com/nachodev-ui/composition_discord_bot/main/assets/builds/05-bear-paws-x2.png',
};
```

`pnpm run check` valida el PNG local por firma, CRC de chunks, descompresión completa, dimensiones y límite de tamaño. El workflow también descarga y decodifica la URL pública después de cada actualización de `main`.
'''
          if old_section not in readme:
              raise SystemExit('No se encontró la sección antigua de imágenes en README.md')
          readme_path.write_text(
              readme.replace(old_section, new_section),
              encoding='utf-8',
              newline='\n',
          )

          Path('assets/builds/README.md').write_text(
              '''# Imágenes de builds

Las imágenes se publican mediante URLs web directas y el embed las muestra con `EmbedBuilder#setImage(url)`. El bot no adjunta archivos locales ni utiliza referencias `attachment://`.

El mapa `BUILD_IMAGE_URL_BY_ROLE` está en:

```text
src/discord/buildPresentation.ts
```

La imagen inicial incluida es:

- `05-bear-paws-x2.png`: PNG optimizado de 500×326 para el rol `Bear Paws (x2)`.

Se eligió PNG porque las builds contienen texto pequeño, iconos y bordes que pierden claridad con JPEG. El archivo pesa aproximadamente 26 KB, por lo que no supone una carga relevante para el embed.

Antes de integrarse, cada PNG debe superar `pnpm run images:validate`. La validación comprueba firma, CRC de todos los chunks, descompresión IDAT completa, dimensiones y tamaño máximo. Así se detectan archivos truncados aunque el encabezado o el MIME parezcan válidos.

Para agregar otra build, sube un PNG optimizado y registra su URL pública directa en `BUILD_IMAGE_URL_BY_ROLE`, usando exactamente el nombre del rol como clave.
''',
              encoding='utf-8',
              newline='\n',
          )
          PY

          cat > scripts/validateBuildImages.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { basename } from 'node:path';
          import { inflateSync } from 'node:zlib';

          const PNG_SIGNATURE = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
          const MAX_IMAGE_BYTES = 100_000;

          function crc32(buffer) {
            let crc = 0xffffffff;
            for (const byte of buffer) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit += 1) {
                crc = (crc >>> 1) ^ ((crc & 1) === 1 ? 0xedb88320 : 0);
              }
            }
            return (crc ^ 0xffffffff) >>> 0;
          }

          function validatePng(filePath) {
            const buffer = readFileSync(filePath);
            if (buffer.length > MAX_IMAGE_BYTES) {
              throw new Error(
                `${filePath}: pesa ${buffer.length} bytes; máximo permitido ${MAX_IMAGE_BYTES}.`,
              );
            }
            if (!buffer.subarray(0, PNG_SIGNATURE.length).equals(PNG_SIGNATURE)) {
              throw new Error(`${filePath}: firma PNG inválida.`);
            }

            let offset = PNG_SIGNATURE.length;
            let header = null;
            let sawEnd = false;
            const compressedParts = [];

            while (offset < buffer.length) {
              if (offset + 12 > buffer.length) {
                throw new Error(`${filePath}: chunk PNG truncado.`);
              }

              const length = buffer.readUInt32BE(offset);
              const typeStart = offset + 4;
              const dataStart = typeStart + 4;
              const dataEnd = dataStart + length;
              const chunkEnd = dataEnd + 4;
              if (chunkEnd > buffer.length) {
                throw new Error(
                  `${filePath}: el chunk declarado excede el tamaño real del archivo.`,
                );
              }

              const typeBuffer = buffer.subarray(typeStart, dataStart);
              const type = typeBuffer.toString('ascii');
              const data = buffer.subarray(dataStart, dataEnd);
              const expectedCrc = buffer.readUInt32BE(dataEnd);
              const actualCrc = crc32(Buffer.concat([typeBuffer, data]));
              if (actualCrc !== expectedCrc) {
                throw new Error(`${filePath}: CRC inválido en el chunk ${type}.`);
              }

              if (type === 'IHDR') {
                if (header !== null || length !== 13) {
                  throw new Error(`${filePath}: IHDR inválido o duplicado.`);
                }
                header = {
                  width: data.readUInt32BE(0),
                  height: data.readUInt32BE(4),
                  bitDepth: data[8],
                  colorType: data[9],
                  compression: data[10],
                  filter: data[11],
                  interlace: data[12],
                };
              } else if (type === 'IDAT') {
                compressedParts.push(data);
              } else if (type === 'IEND') {
                if (length !== 0) {
                  throw new Error(`${filePath}: IEND debe estar vacío.`);
                }
                sawEnd = true;
                offset = chunkEnd;
                break;
              }

              offset = chunkEnd;
            }

            if (header === null || compressedParts.length === 0 || !sawEnd) {
              throw new Error(`${filePath}: faltan IHDR, IDAT o IEND.`);
            }
            if (offset !== buffer.length) {
              throw new Error(`${filePath}: contiene bytes adicionales después de IEND.`);
            }
            if (header.compression !== 0 || header.filter !== 0 || header.interlace !== 0) {
              throw new Error(`${filePath}: usa parámetros PNG no admitidos por el validador.`);
            }

            const channelsByColorType = new Map([
              [0, 1],
              [2, 3],
              [3, 1],
              [4, 2],
              [6, 4],
            ]);
            const channels = channelsByColorType.get(header.colorType);
            if (channels === undefined) {
              throw new Error(`${filePath}: color type PNG ${header.colorType} no admitido.`);
            }

            const rowBytes = Math.ceil((header.width * channels * header.bitDepth) / 8);
            const inflated = inflateSync(Buffer.concat(compressedParts));
            const expectedInflatedBytes = header.height * (rowBytes + 1);
            if (inflated.length !== expectedInflatedBytes) {
              throw new Error(
                `${filePath}: datos incompletos; se esperaban ${expectedInflatedBytes} bytes ` +
                  `y se obtuvieron ${inflated.length}.`,
              );
            }

            for (let row = 0; row < header.height; row += 1) {
              const filterByte = inflated[row * (rowBytes + 1)];
              if (filterByte > 4) {
                throw new Error(`${filePath}: filtro PNG inválido en la fila ${row}.`);
              }
            }

            if (basename(filePath) === '05-bear-paws-x2.png') {
              if (header.width !== 500 || header.height !== 326) {
                throw new Error(
                  `${filePath}: dimensiones inesperadas ${header.width}x${header.height}; ` +
                    'se esperaban 500x326.',
                );
              }
            }

            console.log(
              `${filePath}: PNG válido, ${header.width}x${header.height}, ` +
                `${buffer.length} bytes, decodificación completa.`,
            );
          }

          const files = process.argv.slice(2);
          if (files.length === 0) {
            throw new Error('Uso: node scripts/validateBuildImages.mjs <imagen.png> [...]');
          }
          for (const filePath of files) {
            validatePng(filePath);
          }
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
            push:
              branches:
                - main
                - develop

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 10

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 24

                - name: Enable pnpm
                  run: corepack enable && corepack prepare pnpm@11.17.0 --activate

                - name: Install dependencies
                  run: pnpm install --no-frozen-lockfile

                - name: Validate build catalog
                  run: pnpm run config:validate

                - name: Check
                  run: pnpm run check

                - name: Verify deployed build image
                  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
                  shell: bash
                  run: |
                    set -euo pipefail
                    image_url='https://raw.githubusercontent.com/nachodev-ui/composition_discord_bot/main/assets/builds/05-bear-paws-x2.png'
                    curl --fail --silent --show-error --location \
                      --output /tmp/05-bear-paws-x2.png \
                      "$image_url"
                    node scripts/validateBuildImages.mjs /tmp/05-bear-paws-x2.png
          EOF

          rm .github/workflows/one-shot-image-fix.yml

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(image): wire optimized PNG and validate decoding'
          git push origin HEAD:fix/replace-corrupt-build-image-png
