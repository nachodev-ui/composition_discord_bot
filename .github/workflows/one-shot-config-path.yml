name: Apply image path migration

on:
  push:
    branches:
      - fix/replace-corrupt-build-image-png

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-corrupt-build-image-png
          fetch-depth: 0

      - name: Replace legacy WebP path
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('config/builds.json'); s=p.read_text(encoding='utf-8'); old='assets/builds/05-bear-paws-x2.webp'; new='assets/builds/05-bear-paws-x2.png'; assert s.count(old) == 1, f'referencias inesperadas: {s.count(old)}'; p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')"
          rm .github/workflows/one-shot-config-path.yml

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/builds.json .github/workflows/one-shot-config-path.yml
          git commit -m 'fix(config): reference optimized PNG asset'
          git push origin HEAD:fix/replace-corrupt-build-image-png
