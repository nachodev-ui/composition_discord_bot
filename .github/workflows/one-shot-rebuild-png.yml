name: Rebuild optimized PNG

on:
  push:
    branches:
      - fix/replace-corrupt-build-image-png

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-corrupt-build-image-png
          fetch-depth: 0

      - name: Rebuild and validate PNG
        shell: bash
        run: |
          set -euo pipefail
          cat .image-upload/part-00.b64 \
              .image-upload/part-01.b64 \
              .image-upload/part-02.b64 \
              .image-upload/part-03.b64 \
              .image-upload/part-04.b64 \
            | base64 --decode > assets/builds/05-bear-paws-x2.png
          node scripts/validateBuildImages.mjs assets/builds/05-bear-paws-x2.png
          rm -rf .image-upload
          rm .github/workflows/one-shot-rebuild-png.yml

      - name: Commit rebuilt binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(image): rebuild valid optimized PNG'
          git push origin HEAD:fix/replace-corrupt-build-image-png
