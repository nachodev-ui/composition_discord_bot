name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate build catalog
        run: pnpm run config:validate

      - name: Check
        run: pnpm run check

      - name: Verify remote build image
        shell: bash
        run: |
          set -euo pipefail
          image_url='https://cdn.jsdelivr.net/gh/nachodev-ui/composition_discord_bot@ec482cdad5308271b5edf09428cc5b00360662fa/assets/builds/05-bear-paws-x2.webp'
          content_type="$(curl --fail --silent --show-error --location \
            --output /tmp/05-bear-paws-x2.webp \
            --write-out '%{content_type}' \
            "$image_url")"

          test -s /tmp/05-bear-paws-x2.webp
          case "$content_type" in
            image/*) ;;
            *) echo "Content-Type inesperado: $content_type" >&2; exit 1 ;;
          esac
          file --brief --mime-type /tmp/05-bear-paws-x2.webp | grep -E '^image/'
