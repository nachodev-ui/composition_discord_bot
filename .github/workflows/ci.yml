name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate build catalog
        run: pnpm run config:validate

      - name: Check
        run: pnpm run check

      - name: Verify deployed build image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image_url='https://raw.githubusercontent.com/nachodev-ui/composition_discord_bot/main/assets/builds/05-bear-paws-x2.png'
          curl --fail --silent --show-error --location \
            --output /tmp/05-bear-paws-x2.png \
            "$image_url"
          node scripts/validateBuildImages.mjs /tmp/05-bear-paws-x2.png
