name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/composition

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: composition
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d composition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate legacy migration catalog
        run: pnpm run config:validate

      - name: Check application
        run: pnpm run check

      - name: Apply PostgreSQL migrations
        run: pnpm run db:migrate

      - name: Import legacy builds
        run: pnpm run db:import-legacy

      - name: Verify PostgreSQL schema and imported data
        run: pnpm run db:verify
