name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate legacy migration catalog
        run: pnpm run config:validate

      - name: Check
        run: pnpm run check
